<?xml version="1.0" encoding="UTF-8"?>
<!-- Valtus primary logo — editable source (vector). Rounded graphite tile with
     a steel-blue chevron "V"; the chevron doubles as a subtle shield silhouette. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182131"/>
      <stop offset="1" stop-color="#10161F"/>
    </linearGradient>
    <linearGradient id="v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FA0CE"/>
      <stop offset="1" stop-color="#3D6E9E"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#tile)" stroke="#2E3F5C" stroke-width="4"/>
  <path d="M128,150 L256,392 L384,150" fill="none" stroke="url(#v)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M186,150 L256,282 L326,150" fill="none" stroke="#7FA8D9" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
</svg>
