# Valtus live-session (casper) configuration.
#
# IMPORTANT — BUILD_SYSTEM IS FUNCTIONAL, NOT BRANDING:
# casper-helpers checks `BUILD_SYSTEM` against "Debian"/"Ubuntu" to decide
# MP_QUIET. Any other value makes casper run `modprobe "" -b overlay`, which
# kmod rejects, so the live boot dies with:
#     "/cow format specified as 'overlay' and no support found"
# Keep it "Ubuntu" (it is, in fact, the Ubuntu kernel/casper we ship).
# Valtus branding lives in FLAVOUR/USERNAME/HOST below and in os-release.
export USERNAME="valtus"
export USERFULLNAME="Valtus Live User"
export HOST="valtus"
export BUILD_SYSTEM="Ubuntu"
export FLAVOUR="valtus"
