# =============================================================================
# Valtus — distribution identity & build configuration
# =============================================================================
# Sourced by POSIX shell (no double quotes inside values).
# Credentials/sensitive values are NOT here — see config/valtus.env.
# =============================================================================

# --- Identity ---------------------------------------------------------------
# Lowercase, filesystem/URL-safe identifier (paths, os-release ID, ISO name).
DISTRO_ID="valtus"

# Human-readable distribution name.
DISTRO_NAME="Valtus"

# Semantic version. 0.1.0 = first development release (not "stable").
DISTRO_VERSION="0.1.0"

# Short release codename, one lowercase word.
DISTRO_CODENAME="granite"

# One-line description used in os-release PRETTY_NAME and ISO metadata.
DISTRO_DESCRIPTION="Valtus 0.1.0 'granite' - a professional, security-focused desktop Linux based on Ubuntu LTS"

# --- System presentation ----------------------------------------------------
DISTRO_HOSTNAME="valtus"

# Default locale, keyboard layout and timezone for the live session.
DISTRO_LOCALE="en_US.UTF-8"
DISTRO_KEYBOARD="us"
DISTRO_TIMEZONE="Etc/UTC"

# --- Desktop ----------------------------------------------------------------
# Plasma color scheme (shipped in branding/themes/), icon theme, fonts.
DISTRO_THEME="ValtusDark"
DISTRO_ICONS="breeze"
DISTRO_FONT="Noto Sans"
DISTRO_FONT_SIZE="10"

# --- Branding asset paths (relative to project root) ------------------------
DISTRO_WALLPAPER="branding/wallpapers/valtus-wallpaper.png"
DISTRO_WALLPAPER_SVG="branding/wallpapers/valtus-wallpaper.svg"
DISTRO_LOGO="branding/logos/valtus-logo.png"
DISTRO_LOGO_SVG="branding/logos/valtus-logo.svg"

# --- Default applications (rationale in docs/ARCHITECTURE.md) ---------------
DISTRO_TERMINAL="konsole"
DISTRO_FILE_MANAGER="dolphin"
DISTRO_EDITOR="kate"
DISTRO_BROWSER="falkon"
DISTRO_DOCVIEWER="okular"
DISTRO_MEDIAPLAYER="vlc"
DISTRO_ARCHIVER="ark"
DISTRO_SCREENSHOT="kde-spectacle"
DISTRO_SYSMONITOR="plasma-systemmonitor"
DISTRO_SETTINGS="systemsettings"
DISTRO_SOFTCENTER="plasma-discover"

# --- Build inputs -----------------------------------------------------------
# Base distribution release (Ubuntu LTS) and package mirror.
BASE_DISTRO="noble"
BASE_DISTRO_VERSION="24.04"
BASE_MIRROR="http://archive.ubuntu.com/ubuntu"

# Target machine architecture.
DISTRO_ARCH="amd64"

# ISO volume label: max 32 chars, ISO9660-safe (A-Z, 0-9, underscore only).
# Casper scans for a medium with /casper, but a clean label aids identification.
ISO_VOLUME_LABEL="VALTUS_010_AMD64"

# --- Optional components ----------------------------------------------------
# Path to the Valtus Security (antivirus) project. When set and present, the
# build compiles its debs and installs them into the image (stage 3).
# Leave empty to build without the antivirus.
VALTUS_AV_SRC="/mnt/c/Users/hp/Desktop/Valtus antivirus/valtus-security"

# --- Size policy ------------------------------------------------------------
# Soft budget for the finished ISO; validation fails if exceeded.
# User requirement: far below 60 GB total; we target <= 4 GiB for the ISO.
# (The antivirus engine adds ~2 GB installed; the ISO budget is raised to 6 GiB
# and validation updated accordingly — still far below the 60 GB requirement.)
ISO_SIZE_LIMIT_BYTES=$((6 * 1024 * 1024 * 1024))
