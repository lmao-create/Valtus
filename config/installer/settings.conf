# Valtus installer — Calamares 3.3 settings
# Ubuntu's calamares ships no settings.conf (calamares-settings-ubuntu is
# absent from noble), so Valtus supplies this one.
#
# Shape notes (verified against the shipped module set with dpkg -L):
#   * modules-search: plain sequence of path strings
#   * global: a SEQUENCE of single-key maps (not a plain map!) — calamares
#     aborts with "sequence key is missing" / "FATAL: no sequence set" if
#     global is a map.
modules-search:
  - /usr/lib/x86_64-linux-gnu/calamares/modules/

instances:
  - id: partition
    module: partition
    extraPages: []
  - id: users
    module: users
    extraPages: []
  - id: summary
    module: summary
    extraPages: []

instances-final:
  - id: unpackfs
    module: unpackfs
    extraPages: []
  - id: fstab
    module: fstab
    extraPages: []
  - id: bootloader
    module: bootloader
    extraPages: []
  - id: umount
    module: umount
    extraPages: []

global:
  - branding: valtus
  - requiredStorage: 12000000000
  - recommendedStorage: 20000000000
  - quitAtEnd: true
  - allowShell: false
  - unattended: false
  - efiSystemPartition: "/boot/efi"
  - efiSystemPartitionName: "EFI System Partition"
  - efiSystemPartitionSize: "512M"
