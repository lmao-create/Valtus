# =============================================================================
# Valtus installer — Calamares 3.3 settings (minimal, verified shape)
# =============================================================================
# Ubuntu's calamares package ships NO settings.conf (calamares-settings-ubuntu
# is absent from noble), so Valtus must supply one.
#
# Modules live at /usr/lib/<multiarch>/calamares/modules/ (verified with
# dpkg -L calamares) — this list is kept minimal on purpose: a larger
# settings.conf whose shape does not match the shipped module set aborts the
# installer at startup ("FATAL: no sequence set").
#
# Extend this file one section at a time and re-test; keep only what works.
# =============================================================================

modules-search:
  - /usr/lib/x86_64-linux-gnu/calamares/modules/
