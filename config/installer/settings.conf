# =============================================================================
# Valtus installer — Calamares 3.3 settings
# =============================================================================
# Matches the module set actually shipped by Ubuntu's calamares package
# (modules live in /usr/lib/<multiarch>/calamares/modules/ — verified).
#
# Module list deliberately minimal: welcome/locale/keyboard pages, partition
# (KPM core), users (no empty passwords), summary; then unpackfs, fstab,
# grubcfg, bootloader. No slideshow module (keeps the image small).
# =============================================================================

modules-search:
  - /usr/lib/x86_64-linux-gnu/calamares/modules/
  - /usr/share/calamares/modules/

instances:
  - id: welcome
    module: welcome
    extraPages: []
  - id: locale
    module: locale
    extraPages: []
  - id: keyboard
    module: keyboard
    extraPages: []
  - id: partition
    module: partition
    extraPages:
      - "partition/partition.js"
      - "partition/partition.conf"
  - id: users
    module: users
    extraPages:
      - "users/users.conf"
  - id: summary
    module: summary
    extraPages: []

instances-final:
  - id: unpackfs
    module: unpackfs
    extraPages:
      - "unpackfs.conf"
  - id: fstab
    module: fstab
    extraPages:
      - "fstab.conf"
  - id: grubcfg
    module: grubcfg
    extraPages:
      - "grubcfg.conf"
  - id: bootloader
    module: bootloader
    extraPages:
      - "bootloader.conf"
  - id: umount
    module: umount
    extraPages: []

# --- global settings --------------------------------------------------------
global:
  branding: valtus
  # Locale / keyboard defaults for Valtus.
  locale:
    region: "en"
    timezone: "Etc/UTC"
  keyboard:
    layout: "us"
    model: "pc105"
    variant: ""
  # Storage minimums (12 GiB) and recommendation (20 GiB).
  requiredStorage: 12000000000
  recommendedStorage: 20000000000
  # Reboot when the installer finishes.
  quitAtEnd: true
  # Unattended mode is opt-in (flipped by the automated test).
  unattended: false
  # Do not show the shell utility menu.
  allowShell: false
  # EFI system partition (UEFI installs).
  efiSystemPartition: "/boot/efi"
  efiSystemPartitionName: "EFI System Partition"
  efiSystemPartitionSize: "512M"
