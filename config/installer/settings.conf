# Valtus installer — Calamares 3.3 settings
# Ubuntu's calamares ships no settings.conf (calamares-settings-ubuntu is
# absent from noble), so Valtus supplies this one. Shape verified against the
# module paths actually shipped (dpkg -L calamares:
# /usr/lib/x86_64-linux-gnu/calamares/modules/).
#
# modules-search must be a plain sequence of path strings.
# calamares 3.3 requires an `instances` sequence (missing it aborts startup:
# "sequence key is missing" / "FATAL: no sequence set").

modules-search:
  - /usr/lib/x86_64-linux-gnu/calamares/modules/

instances:
  - id: partition
    module: partition
    extraPages: []
  - id: users
    module: users
    extraPages: []
  - id: summary
    module: summary
    extraPages: []

instances-final:
  - id: unpackfs
    module: unpackfs
    extraPages: []
  - id: fstab
    module: fstab
    extraPages: []
  - id: bootloader
    module: bootloader
    extraPages: []
  - id: umount
    module: umount
    extraPages: []

global:
  branding: valtus
  requiredStorage: 12000000000
  recommendedStorage: 20000000000
  quitAtEnd: true
  allowShell: false
  unattended: false
  efiSystemPartition: "/boot/efi"
  efiSystemPartitionName: "EFI System Partition"
  efiSystemPartitionSize: "512M"
