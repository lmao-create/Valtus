# =============================================================================
# Valtus installer — Calamares 3.3 settings
# =============================================================================
# Module execution order (adapted from the Ubuntu/Kubuntu defaults for a
# live-session install that installs the *live* filesystem to disk).
modules-search:
  - model:
      - /usr/share/calamares/model/
prompts:
  - "welcome"
  - "locale"
  - "keyboard"
  - "partition"
  - "users"
  - "summary"

instances:
  - id: welcome
    module: welcome
    config: welcome
    extraPages: null
  - id: locale
    module: locale
    config: locale
    extraPages: null
  - id: keyboard
    module: keyboard
    config: keyboard
    extraPages: null
  - id: partition
    module: partition
    config: partition
    extraPages:
      - "partition/partition.js"
      - "partition/partition.conf"
  - id: users
    module: users
    config: users
    extraPages:
      - "users/users.conf"
  - id: summary
    module: summary
    config: summary
    extraPages: null
  - id: finished
    module: finished
    config: finished
    extraPages: null

instances-final:
  - id: unpackfs
    module: unpackfs
    config: unpackfs
    extraPages:
      - "branding"
      - "unpackfs.conf"
  - id: fstab
    module: fstab
    config: fstab
    extraPages:
      - "fstab.conf"
  - id: grubcfg
    module: grubcfg
    config: grubcfg
    extraPages:
      - "grubcfg.conf"
  - id: bootloader
    module: bootloader
    config: bootloader
    extraPages:
      - "bootloader.conf"
  - id: services
    module: services
    config: services
    extraPages:
      - "services.conf"
  - id: packages
    module: packages
    config: packages
    extraPages:
      - "packages.conf"
  - id: umount
    module: umount
    config: umount
    extraPages: null

# --- global settings --------------------------------------------------------
global:
  # KDE Plasma is the target desktop.
  branding: valtus
  # Unattended mode: skip the interactive pages (used by the automated test
  # and by unattended deployments). The installer is still run as the
  # ordinary user; privileged actions go through the Calamares polkit helper.
  unattended: false
  # Where the live filesystem is mounted by unpackfs.
  # (the live medium is found by casper at /cdrom or /run/live/medium)
  # Require at least 12 GiB of disk, 4 GiB RAM recommended.
  requiredStorage: 12000000000
  recommendedStorage: 20000000000
  # Do not allow installing to the same disk as the live medium.
  quitAtEnd: true
  # Show the shell utility menu (Ctrl+Shift+S) only for the live user.
  allowShell: false
  # EFI is required on amd64 for a modern install.
  efiSystemPartition: "/boot/efi"
  efiSystemPartitionName: "EFI System Partition"
  efiSystemPartitionSize: "512M"
  # Write the bootloader to the ESP and the target disk's MBR where relevant.
  # Bootloader entry names use the branding values (bootloaderEntryName).
  # Locale / keyboard defaults for Valtus.
  locale:
    region: "en"
    timezone: "Etc/UTC"
  keyboard:
    layout: "us"
    model: "pc105"
    variant: ""
  # Users module defaults: the Valtus corporate-style default user.
  users:
    # Default hostname comes from the first user's login.
    # (the user may change it; placeholder shown below)
    hostname: "valtus"
    # Require a password for the primary user (no empty passwords).
    requireStrongPassword: false
    # Do not reuse the documented live-session password (the installer asks
    # the user to choose their own — enforced by the password field).
    allowRoot: false
    # Default login shell and extra groups.
    loginShell: "/bin/bash"
    autologin: false
