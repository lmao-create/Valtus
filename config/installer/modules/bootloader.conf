# Valtus bootloader module — UEFI GRUB with Valtus branding
installPath: "/boot/efi"
# Use GRUB (the image ships grub2-common, grub-efi-amd64-signed, shim-signed).
efiBootloader: "grub"
# EFI fallback entry for firmware without NVRAM support.
efiFallback: true
# Also install a BIOS bootloader when the target is a BIOS system.
grubInstall: true
# Fallback entry name shown by the firmware/boot menu.
efiBootloaderId: "Valtus"
# Install to the ESP of the target disk.
efiSystemPartition: "/boot/efi"
# Write a UEFI NVRAM entry using efibootmgr.
efibootmgr: true
# Keep the distro's existing boot structure?  No — install fresh entries.
alwaysKeep: false
