# Valtus users module — no empty passwords, hostname comes from the user
copyHostname: false
userChoiceMsg: "Choose the primary account for this Valtus system. This account is used to sign in, install software, and administer the system."
# Require a password twice and confirm it. Default user groups on Ubuntu.
requireStrongPassword: false
# The password is set through the GUI; no default password is written.
sudoersGroup: "sudo"
defaultGroups:
  - "sudo"
  - "adm"
  - "cdrom"
  - "dip"
  - "plugdev"
  - "lpadmin"
  - "sambashare"
  - "users"
# Extra Valtus security groups (firewall + device access).
extraGroups: []
# Shell for the created user.
defaultShell: "/bin/bash"
# Do not allow an empty password.
allowEmptyPassword: false
# Show the "log in automatically" checkbox (default off).
autologinAvailable: true
# Also set the hostname automatically from the user name.
setHostname: false
