# Valtus installer — unattended mode template
#
# Calamares' `unattended` module allows the installer to run without the
# interactive prompts, which is what the automated installer test uses
# (and what unattended deployments would use).
#
# The *username* and *password hash* are NOT committed here: the test script
# generates them at run time and writes them into the guest, so no credential
# lives in this repository. This file therefore only carries the non-secret
# policy.
#
# To enable unattended mode: `unattended: true` in settings.conf, then run
#   calamares -d            (as the ordinary user, never with sudo)
#
userFullname: "Valtus User"
userGroups: "sudo,adm,cdrom,dip,plugdev,lpadmin,sambashare"
userPassword: ""
# Do not rotate the password at boot (the operator sets it once).
rotatePassword: false
# Hostname is derived from the user name unless set explicitly here.
hostname: ""
