# Valtus fstab module — ext4 by default
writeFstab: true
# Filesystems to include in the generated /etc/fstab.
fstabHeader: |
  # /etc/fstab: static file system information for Valtus.
  # <file system> <mount point> <type> <options> <dump> <pass>
# Default options for ext4.
efstabOptions: "defaults"
